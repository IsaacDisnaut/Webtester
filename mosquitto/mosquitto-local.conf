# Local Windows config — base for start-local.bat, which copies it to
# mosquitto-runtime.conf and appends the WSS 9443 listener with this clone's
# absolute cert paths (Mosquitto can't resolve relative ones, and the certs
# themselves aren't in git). Works on its own too, without 9443:
#   "C:\Program Files\Mosquitto\mosquitto.exe" -c mosquitto\mosquitto-local.conf -v

# Plain MQTT TCP (deep.py)
listener 1883
allow_anonymous true

# Plain WebSocket (used by Node.js proxy at /ws/mqtt)
listener 9001
protocol websockets
allow_anonymous true
